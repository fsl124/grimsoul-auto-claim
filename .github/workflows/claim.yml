name: Grim Soul Daily Claim

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  claim:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('**/claim.py') }}
          restore-keys: |
            ${{ runner.os }}-playwright-chromium-

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          pip install --no-cache-dir playwright
          playwright install chromium

      - name: Run claim script
        env:
          GRIMSOUL_ACCOUNT_ID: ${{ secrets.GRIMSOUL_ACCOUNT_ID }}
        run: python claim.py

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grimsoul-screenshots
          path: |
            /tmp/daily_rewards.png
            /tmp/store.png
          retention-days: 7
