name: Grim Soul Daily Claim

on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:

jobs:
  claim:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Run claim script
        env:
          GRIMSOUL_ACCOUNT_ID: ${{ secrets.GRIMSOUL_ACCOUNT_ID }}
        run: python claim.py

      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        if: always()   # 即使脚本失败也上传截图，方便调试
        with:
          name: grimsoul-screenshot
          path: /tmp/grimsoul_result.png
          retention-days: 7   # 保留 7 天，可根据需要修改
