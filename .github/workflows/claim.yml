name: Grim Soul Daily Claim

on:
  schedule:
    # 每天 UTC 00:30 运行，对应北京时间 08:30
    - cron: '30 0 * * *'
  workflow_dispatch:  # 允许手动触发

jobs:
  claim:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('**/claim.py') }}
          restore-keys: |
            ${{ runner.os }}-playwright-chromium-

      - name: Install dependencies
        run: |
          pip install --no-cache-dir playwright
          playwright install chromium --with-deps

      - name: Run claim script
        env:
          GRIMSOUL_ACCOUNT_ID: ${{ secrets.GRIMSOUL_ACCOUNT_ID }}
        run: python claim.py

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: always()   # 即使前面步骤失败也上传截图，方便调试
        with:
          name: grimsoul-screenshots
          path: |
            /tmp/daily_rewards.png
            /tmp/store.png
          retention-days: 7   # 截图保留 7 天
